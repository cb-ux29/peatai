<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeatAI: Ray Peat Soru-Cevap</title>
<style>
:root{
  --soil:#2C2218; --soil-edge:#46372A; --paper:#D9DCC8; --field:#EEF0E1;
  --ink:#1F1A12; --brown:#6B3A12; --link:#1A3C8C; --btn:#C6C9B0; --btn-hi:#EAEBDB; --err:#8C1D1D;
}
*{box-sizing:border-box}
body{margin:0;padding:24px 12px;background:var(--soil);color:var(--ink);
  font-family:"Times New Roman",Times,"Liberation Serif",serif;font-size:18px;line-height:1.5}
.page{max-width:760px;margin:0 auto;background:var(--paper);border:4px double var(--ink);
  box-shadow:0 0 0 6px var(--soil-edge);padding:22px 26px 18px}
header{text-align:center}
h1{margin:0;font-size:2.5rem;font-weight:700;letter-spacing:.04em}
.tag{margin:4px 0 0;font-style:italic}
hr{border:0;border-top:2px solid var(--ink);margin:16px 0}
h2{font-size:1.15rem;margin:0 0 6px}
.examples{margin:0 0 4px;padding-left:22px}
.examples li{margin:3px 0}
button.link{background:none;border:0;padding:0;font:inherit;color:var(--link);text-decoration:underline;cursor:pointer;text-align:left}
button.link:hover{color:var(--brown)}
.turn{margin:0 0 18px}
.turn b{color:var(--brown)}
.ans{white-space:pre-wrap;line-height:1.6;margin-top:2px}
.turn.err .ans{color:var(--err)}
.hint{font-style:italic;margin-top:4px}
.cursor{display:inline-block;width:.6em;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
label{display:block;font-weight:700;margin-bottom:4px}
textarea{width:100%;resize:vertical;min-height:84px;font:inherit;color:var(--ink);
  background:var(--field);border:3px inset #8A8670;padding:8px 10px}
.btn{font:inherit;font-weight:700;color:var(--ink);background:var(--btn);
  border:3px outset var(--btn-hi);padding:6px 18px;cursor:pointer}
.btn:active{border-style:inset}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row{margin-top:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.row small{font-style:italic}
textarea:focus-visible,.btn:focus-visible,button.link:focus-visible{outline:2px solid var(--brown);outline-offset:2px}
.note{font-size:.85rem;text-align:center;margin:0}
@media (max-width:520px){.page{padding:16px 14px}h1{font-size:2rem}}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>PeatAI</h1>
    <p class="tag">Dr. Ray Peat'in bakış açısıyla Türkçe soru ve cevap</p>
  </header>
  <hr>

  <section id="intro">
    <h2>Örnek sorular</h2>
    <ul class="examples">
      <li><button class="link" type="button">Tiroid hormonu metabolizma için neden önemli?</button></li>
      <li><button class="link" type="button">Şeker ve meyve suyu hakkında Ray Peat ne diyor?</button></li>
      <li><button class="link" type="button">Progesteron ve östrojen dengesi nedir?</button></li>
      <li><button class="link" type="button">Çoklu doymamış yağlar neden sorun olabilir?</button></li>
    </ul>
    <hr>
  </section>

  <section id="log" aria-live="polite"></section>

  <form id="form">
    <label for="q">Sorunu yaz:</label>
    <textarea id="q" placeholder="Örnek: Kalp sağlığı için hangi besinler önemli?"></textarea>
    <div class="row">
      <button class="btn" id="send" type="submit">Soruyu gönder</button>
      <small>Enter ile gönderilir, satır atlamak için Shift+Enter.</small>
    </div>
  </form>

  <hr>
  <p class="note">Yanıtlar yapay zekâ ile üretilir ve tıbbi tavsiye yerine geçmez.</p>
</div>

<script>
const API_BASE = "https://peatai-backend.onrender.com";
const log = document.getElementById("log");
const intro = document.getElementById("intro");
const form = document.getElementById("form");
const box = document.getElementById("q");
const sendBtn = document.getElementById("send");
let busy = false;

// Sunucu uyuyorsa sayfa açılır açılmaz uyandır
fetch(API_BASE + "/health").catch(() => {});

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function format(text){
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/^\s*[*-]\s+/gm,"• ");
}
function addTurn(cls, label, html){
  const d = document.createElement("div");
  d.className = "turn " + cls;
  d.innerHTML = "<b>" + label + "</b><div class=\"ans\">" + html + "</div>";
  log.appendChild(d);
  d.scrollIntoView({block:"nearest"});
  return d;
}

async function ask(question){
  if (busy || !question.trim()) return;
  busy = true; sendBtn.disabled = true;
  if (intro) intro.remove();
  addTurn("q", "Soru:", escapeHtml(question));

  const wait = addTurn("a", "Cevap:", 'Hazırlanıyor<span class="cursor">▌</span><div class="hint" id="hint"></div>');
  const t1 = setTimeout(() => {
    const h = wait.querySelector("#hint");
    if (h) h.textContent = "Sunucu uyanıyor. İlk soruda bu bir dakikaya kadar sürebilir, lütfen bekle.";
  }, 8000);

  const ctrl = new AbortController();
  const t2 = setTimeout(() => ctrl.abort(), 120000);

  try {
    const res = await fetch(API_BASE + "/ask-peat", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({question: question}),
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    wait.remove();
    addTurn("a", "Cevap:", format(data.answer_tr || "Boş yanıt geldi, soruyu farklı yazmayı dene."));
  } catch (e) {
    wait.remove();
    let msg = "Cevap alınamadı. İnternet bağlantını kontrol edip tekrar dene.";
    if (e.name === "AbortError") msg = "Sunucu zamanında yanıt vermedi. Bir dakika sonra tekrar dene.";
    else if (String(e.message).includes("HTTP 5")) msg = "Sunucu şu an yanıt veremiyor. Biraz sonra tekrar dene.";
    else if (String(e.message).includes("HTTP 4")) msg = "İstek sunucuya ulaştı ama kabul edilmedi (" + e.message + ").";
    const err = addTurn("err", "Hata:", escapeHtml(msg));
    const b = document.createElement("button");
    b.className = "btn"; b.type = "button"; b.textContent = "Tekrar dene";
    b.style.marginTop = "8px";
    b.onclick = () => { err.remove(); busy = false; ask(question); };
    err.appendChild(b);
  } finally {
    clearTimeout(t1); clearTimeout(t2);
    busy = false; sendBtn.disabled = false;
  }
}

form.addEventListener("submit", ev => {
  ev.preventDefault();
  const v = box.value.trim();
  if (!v) return;
  box.value = "";
  ask(v);
});
box.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); form.requestSubmit(); }
});
document.querySelectorAll("button.link").forEach(c => c.addEventListener("click", () => ask(c.textContent)));
</script>
</body>
</html>
